name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI only needs read access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # Keep collecting macOS results when Windows fails.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Default line ending conversion, so Windows runs get files the way Windows users clone them.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        id: install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Package
        id: package
        run: npm run package
      - name: Electron tests
        run: npm run test:electron
      - name: Packaged tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npm run test:packaged
      - name: Upload failure results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Make Windows installer
        run: npm run make:win
      - name: Windows installer tests
        run: node scripts/windows-installer-smoke.mjs
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-setup
          path: out/make/squirrel.windows/x64/Code-Learning-win-x64-Setup.exe
          retention-days: 7

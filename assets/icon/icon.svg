<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Code Learning — 길눈</title>
  <desc id="desc">파란 둥근 사각형 위의 옅은 파랑 물방울 캐릭터. 노란 지느러미와 호기심 많은 큰 눈 하나로 낯선 코드 속을 함께 살피는 안내자를 표현한다.</desc>
  <defs>

      <stop stop-color="#3977C9"/>
      <stop offset=".6" stop-color="#285EAC"/>
      <stop offset="1" stop-color="#214E91"/>
    </linearGradient>
    <linearGradient id="creature" x1="449" y1="317" x2="606" y2="750" gradientUnits="userSpaceOnUse">
